name: CI — Lint & Typecheck

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint
        continue-on-error: true  # Remove once lint warnings are resolved

      - name: TypeScript typecheck
        run: npm run typecheck
        continue-on-error: true  # Remove once as-any casts are fixed

      - name: Next.js build
        run: npm run build
        env:
          # Placeholder values for CI build only — no real Supabase calls are made.
          # The build needs these env vars to exist or Next.js will fail at compile time.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build-only
